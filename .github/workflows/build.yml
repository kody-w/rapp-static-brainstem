name: build

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"   # daily: re-fetch url sources; unchanged days commit nothing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build (the only build step)
        run: python build.py
      - name: Commit only real changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: refresh the static brainstem [skip ci]"
          git pull --rebase
          git push
